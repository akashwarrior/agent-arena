syntax = "proto3";

message Point {
  float x = 1;
  float y = 2;
}

message Food {
  float x = 1;
  float y = 2;
}

message Agent {
  string id = 1;
  string name = 2;
  string color = 3;
  string accent = 4;
  bool alive = 5;
  uint32 score = 6;
  float size = 7;
  float angle = 8;
  Point head = 9;
  repeated Point body = 10;
  uint32 length = 11;
  optional uint32 rank = 12;
}

message LiveMatchTick {
  uint32 game_id = 1;
  uint32 remaining_ms = 2;
  repeated Food food = 3;
  repeated Agent agents = 4;
}

message MatchEnd {
  uint32 game_id = 1;
  Agent winner = 2;
}

message ServerMessage {
  oneof payload {
    LiveMatchTick tick = 1;
    MatchEnd match_end = 2;
  }
}
